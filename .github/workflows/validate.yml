name: Validate loader

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Sprawdź składnię
        run: node --check landek.user.js
      - name: Sprawdź host i nagłówki loadera
        run: |
          grep -q "==UserScript==" landek.user.js
          grep -q "landek-access.landek.workers.dev" landek.user.js
